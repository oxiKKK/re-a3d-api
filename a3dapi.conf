; Project additions in A3D_FIXES builds. Edit and restart the game.
; Keep this file beside the loaded a3dapi.dll, not in the working directory.
; Missing/invalid settings use these defaults. true/false and 1/0 accepted.
[A3D]
; Expose software capabilities to legacy hardware queries (including Q3).
EmulateHardware = true
; Either software effect selects A2D instead of hardware acquisition.
SoftwareReverb = false
SoftwareReflections = false
; Avoid the two known property-set wait deadlocks.
FixPropertyDeadlocks = true
; Replacement decoders; AC-3 DirectShow fallback remains separate.
EnableMP3Decoder = true
EnableAC3Decoder = true
; Select 678 scrolling credits instead of the original 677 program.
UseNewCredits = false
; Skip the My Computer requirement; Calculator is still required.
RelaxCreditsActivation = false
